<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Cyber Solutions architecture</title>
  <desc id="d">Browsers and the extension reach Caddy over HTTPS. Caddy forwards to gunicorn running the Flask app, which uses the URL rules, Google Safe Browsing, URLhaus and an optional ML model, and stores history and contact messages on a volume. Health, readiness and metrics endpoints feed monitoring.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .app{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}
      .ext{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5;stroke-dasharray:6 4}
      .store{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}
      .ops{fill:#faf5ff;stroke:#7e22ce;stroke-width:1.5}
      .h{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:12px;fill:#475569}
      .l{font-size:11.5px;fill:#334155}
      .z{font-size:12px;font-weight:600;fill:#64748b;letter-spacing:.08em}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>

  <text class="z" x="30" y="30">PEOPLE</text>
  <rect class="box" x="30" y="44" width="190" height="86" rx="10"/>
  <text class="h" x="46" y="72">Web browser</text><text class="s" x="46" y="92">index.html, script.js,</text><text class="s" x="46" y="108">style.css (same origin)</text>
  <rect class="box" x="30" y="150" width="190" height="86" rx="10"/>
  <text class="h" x="46" y="178">Browser extension</text><text class="s" x="46" y="198">Right-click “Check link”</text><text class="s" x="46" y="214">/scan and /health only</text>

  <text class="z" x="270" y="30">EDGE (HTTPS)</text>
  <rect class="box" x="270" y="44" width="190" height="192" rx="10"/>
  <text class="h" x="286" y="72">Caddy or nginx</text>
  <text class="s" x="286" y="94">Certificates, auto-renewed</text><text class="s" x="286" y="112">HTTP → HTTPS redirect</text>
  <text class="s" x="286" y="130">32 KB request limit</text><text class="s" x="286" y="148">Passes real client IP</text>
  <text class="s" x="286" y="166">(X-Forwarded-*)</text><text class="s" x="286" y="190">Checks /ready every 30 s</text>
  <text class="s" x="286" y="214">Optional: proxy rate limits</text>

  <text class="z" x="510" y="30">APPLICATION (one gunicorn worker, 8 threads)</text>
  <rect class="app" x="510" y="44" width="420" height="192" rx="10"/>
  <text class="h" x="526" y="72">Flask app: urldetection.py</text>
  <text class="s" x="526" y="94">Security headers + CSP, exact-match CORS, body limit</text>
  <text class="s" x="526" y="112">Rate limits: per client, global, API, contact</text>
  <text class="s" x="526" y="130">One JSON error shape, request ids, secrets redacted</text>
  <text class="s" x="526" y="148">Structured request log (no URLs, queries or IPs)</text>
  <text class="s" x="526" y="166">POST /scan · /history · /contact · /evaluation · /privacy</text>
  <text class="s" x="526" y="190">GET /health (live) · /ready · /metrics (token)</text>
  <text class="s" x="526" y="214">Serves only an allow-list of frontend files</text>

  <text class="z" x="510" y="274">DETECTION</text>
  <rect class="box" x="510" y="288" width="130" height="92" rx="10"/>
  <text class="h" x="524" y="314">URL rules</text><text class="s" x="524" y="334">url_features.py</text><text class="s" x="524" y="350">classifier.py</text><text class="s" x="524" y="366">no network</text>
  <rect class="box" x="655" y="288" width="130" height="92" rx="10"/>
  <text class="h" x="669" y="314">Threat intel</text><text class="s" x="669" y="334">threat_intel.py</text><text class="s" x="669" y="350">timeouts, cache,</text><text class="s" x="669" y="366">circuit breaker</text>
  <rect class="box" x="800" y="288" width="130" height="92" rx="10"/>
  <text class="h" x="814" y="314">ML (optional)</text><text class="s" x="814" y="334">ml_model.json</text><text class="s" x="814" y="350">off unless adopted</text><text class="s" x="814" y="366">and switched on</text>

  <text class="z" x="530" y="468">THIRD PARTIES</text>
  <rect class="ext" x="655" y="432" width="130" height="64" rx="10"/>
  <text class="h" x="669" y="458">Google Safe</text><text class="h" x="669" y="476">Browsing</text>
  <rect class="ext" x="800" y="432" width="130" height="64" rx="10"/>
  <text class="h" x="814" y="458">abuse.ch</text><text class="h" x="814" y="476">URLhaus</text>

  <text class="z" x="270" y="274">STORAGE</text>
  <rect class="store" x="270" y="288" width="190" height="92" rx="10"/>
  <text class="h" x="286" y="314">data/</text><text class="s" x="286" y="334">scans.db: scan history</text><text class="s" x="286" y="350">contact_messages.jsonl</text><text class="s" x="286" y="366">Docker volume, auto-expiry</text>

  <text class="z" x="30" y="274">OPERATIONS</text>
  <rect class="ops" x="30" y="288" width="210" height="92" rx="10"/>
  <text class="h" x="46" y="314">Monitoring and logs</text><text class="s" x="46" y="334">JSON log lines on stdout</text><text class="s" x="46" y="350">/metrics (Prometheus text)</text><text class="s" x="46" y="366">smoke_test.py per deploy</text>

  <rect class="box" x="30" y="418" width="400" height="78" rx="10"/>
  <text class="h" x="46" y="444">Secrets</text>
  <text class="s" x="46" y="464">API keys and METRICS_TOKEN come from .env (chmod 600) or Docker</text>
  <text class="s" x="46" y="480">secret files (NAME_FILE). Never in the image, the repo or any log.</text>

  <path class="ln" d="M220 87H270" marker-end="url(#a)"/><path class="ln" d="M220 193H245V120H270" marker-end="url(#a)"/>
  <path class="ln" d="M460 140H510" marker-end="url(#a)"/>
  <path class="ln" d="M575 236V288" marker-end="url(#a)"/><path class="ln" d="M720 236V288" marker-end="url(#a)"/><path class="ln" d="M865 236V288" marker-end="url(#a)"/>
  <path class="ln" d="M720 380V432" marker-end="url(#a)"/><path class="ln" d="M740 380V404H865V432" marker-end="url(#a)"/>
  <path class="ln" d="M530 236V260H440V288" marker-end="url(#a)"/>
  <text class="l" x="226" y="80">HTTPS</text>
  <text class="l" x="468" y="132">HTTP</text>
  <text class="l" x="722" y="262">only addresses</text>
  <text class="l" x="728" y="424">HTTPS</text>
</svg>
