# Render.com blueprint: one web service (the app serves its own frontend). Render provides HTTPS and the domain.
# Not tested here; check the field names against https://render.com/docs/blueprint-spec before using.
# Free instances have no persistent disk: scan history and contact messages reset on every deploy/restart.
services:
  - type: web
    name: cyber-solutions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: HSTS
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: CORS_ORIGINS
        sync: false          # set to https://<your-service>.onrender.com in the dashboard
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false          # secret: enter in the dashboard, never in this file
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
